name: Around
description: 'Around was a video-calling application built for designers, developers, and product teams,
  known for floating circular "heads" that cropped participants to their faces so the call could sit on
  top of the work rather than dominate the screen, plus echo prevention that let several people call from
  the same room. Around was acquired by Miro in June 2022, operated for a period as Around by Miro Labs,
  and was shut down on 31 March 2025, with features such as echo prevention and reactions folded into
  Miro''s own video collaboration surface. The around.co domain is now parked on the GoDaddy/Afternic
  aftermarket and the product, developer portal, and any API surface are gone. This profile is retained
  in the API Evangelist network as a historical record; there is no live API to catalog.'
