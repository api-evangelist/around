x-enrichment-note: 'Enrichment probe 2026-07-20 (re-verified): Around shut down 2025-03-31 following its
  June 2022 acquisition by Miro. around.co now delegates to ns1/ns2.afternic.com and
  https://www.around.co/ redirects cross-host to forsale.godaddy.com/forsale/www.around.co. Every probed
  path (/.well-known/security.txt, /openid-configuration, /oauth-authorization-server, /api-catalog,
  /ai-plugin.json, /llms.txt, /docs, /developers, /api, /openapi.json) returns HTTP 200 from the GoDaddy
  parking catch-all — status codes alone are misleading here. All the .well-known and spec paths serve
  text/html whose body is a JS redirect to /lander, not the advertised media type. TRAP WORTH NOTING
  NETWORK-WIDE: /llms.txt returns text/plain and is a genuinely well-formed llms.txt, but it is
  GoDaddy''s auto-generated FOR-SALE llms.txt describing the domain listing (Buy-It-Now / Make-an-Offer /
  escrow terms) — it is not Around''s and must never be saved as a searched LLMsTxt artifact.
  https://new.around.co no longer presents a valid certificate for that name (TLS unrecognized_name). The
  GitHub org github.com/around is real and domain-verified for around.co, but publishes only .github,
  around (product issue tracker), and around-oss (open-source license attributions) — no OpenAPI, SDK, or
  specification repositories. No OpenAPI/AsyncAPI, packages, MCP server, well-known documents, changelog,
  sandbox, or security program exist to search, generate, or derive. Zero artifacts written: any would be
  fabrication.'
